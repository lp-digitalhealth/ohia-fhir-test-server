server:
  port: 8080

facade:
  hapi-base-url: ${FACADE_HAPI_BASE_URL:http://hapi:8080/fhir}
  public-base-url: ${FACADE_PUBLIC_BASE_URL:http://localhost}
  # The shared S1 token. Empty means every /ode/** request is refused.
  api-token: ${API_TOKEN:}
  data-dir: ${FACADE_DATA_DIR:/data}
  # Tester registry (client id, requesting organization, allowed target URL prefixes, public key).
  # Re-read automatically when the file changes. Missing file = nobody registered.
  clients-file: ${FACADE_CLIENTS_FILE:/config/clients.json}
  seed:
    # Raw file host of the data repository. The ref is a pinned commit, not a branch, so the
    # seeded data cannot change underneath us. Bump it deliberately when the data is updated.
    data-base-url: ${FACADE_SEED_DATA_BASE_URL:https://raw.githubusercontent.com/lp-digitalhealth/ohia-test-data}
    data-ref: ${FACADE_SEED_DATA_REF:445d4ce7460c6e62000e275da84258c84bfa873d}
    package-path: 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-01
  use-cases:
    uc04a:
      # UC04a interaction 1 (the platform's referral with intraoral photos). Pinned commit of the data repository
      # that carries the Subscription fix (PR 45); never a moving branch.
      data-ref: ${FACADE_UC04A_DATA_REF:bafcf439092c2bb868c70336057f928f2428d457}
      package-path: 2026-CMS-Connectathon/fhir-resources/purpose-built/uc04a-teledentistry-commercial/interactions/interaction-01
    receiving:
      # The organization we play when a tester sends US a UC07 referral (the receiving specialist).
      uc07-requesting-organization: ${FACADE_UC07_RECEIVER_ORG:Organization/org-restorative-dental-tx}
  send:
    # Both flags below exist for automated tests only and must stay false in a deployment.
    allow-http: false
    allow-private-targets: false
    manifest-ttl-days: ${FACADE_MANIFEST_TTL_DAYS:30}
  client:
    # How this server behaves when it PULLS from a sender's ARex server (UC04a receive).
    id: ${FACADE_CLIENT_ID:ohia-test-server}
    # Our own key pair. Created on first use if the file is missing; mount a file here to supply your own.
    key-file: ${FACADE_CLIENT_KEY_FILE:${facade.data-dir}/keys/server-key.json}
    requesting-organization: ${FACADE_CLIENT_ORG:Organization/org-barton-springs-dental}
    # The draft ARex spec names no authorization_details type; this is our own default.
    authorization-details-type: ${FACADE_CLIENT_AD_TYPE:arex-manifest}
    max-objects: 20
    max-object-bytes: 10000000
    max-total-bytes: 50000000
    connect-timeout-seconds: 5
    read-timeout-seconds: 60
  patient-access:
    # The payer-side resources (CARIN Blue Button 2.2.0) served to patient apps at /patient-access/fhir. Loaded by
    # POST /ode/admin/seed-patient-access from a PINNED commit of the data repository (UC07 interaction 6), never a
    # moving branch. Bump the ref deliberately when the data changes.
    data-base-url: ${FACADE_PATIENT_ACCESS_DATA_BASE_URL:https://raw.githubusercontent.com/lp-digitalhealth/ohia-test-data}
    data-ref: ${FACADE_PATIENT_ACCESS_DATA_REF:1bb07a826e546391e777bae31394951be8434f04}
    files:
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/patient-joe-castle-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/coverage-joe-castle-dentaquest-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/org-dentaquest-tx-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/org-pediatric-dental-tx-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/org-restorative-dental-tx-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/pract-mary-parker-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/pract-max-garcia-payer.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/eob-pediatric-evaluation-c4bb-oral.json
      - 2026-CMS-Connectathon/fhir-resources/purpose-built/uc07-pediatric-rootcanal/interactions/interaction-06/eob-restorative-treatment-c4bb-oral.json
