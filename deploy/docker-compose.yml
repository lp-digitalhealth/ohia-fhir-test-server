# OHIA FHIR Test Server: generic stack (HAPI FHIR JPA + PostgreSQL + Caddy TLS proxy).
# This is the plain FHIR endpoint plus an interim shared bearer token (see Caddyfile).
# No OAuth, no validation feedback, no payer logic yet.
# Settings come from .env (copy .env.example). Never commit .env.
services:
  hapi-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  hapi:
    image: ${HAPI_IMAGE:-hapiproject/hapi:latest}
    restart: unless-stopped
    depends_on:
      hapi-db:
        condition: service_healthy
    environment:
      # PostgreSQL store (per the HAPI starter README: driver, dialect, search off).
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      # R4, REST-hook subscriptions on, and the public base URL so response links are correct.
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      HAPI_FHIR_SERVER_ADDRESS: ${PUBLIC_BASE_URL:-http://localhost:8080}/fhir
      # A tester's app may be given one of our addresses as its "FHIR base" and then write every reference in its
      # Bundle as a full address under it (https://<host>/ode/receive/uc04a/Patient/x). HAPI refuses those as
      # references to another server (HAPI-0507) unless the address is declared as our own. Declared here, they are
      # stored as ordinary local references (Patient/x).
      HAPI_FHIR_LOCAL_BASE_URLS_0: ${PUBLIC_BASE_URL:-http://localhost:8080}/ode/receive/uc04a
      HAPI_FHIR_LOCAL_BASE_URLS_1: ${PUBLIC_BASE_URL:-http://localhost:8080}/ode/receive/uc07
      HAPI_FHIR_LOCAL_BASE_URLS_2: ${PUBLIC_BASE_URL:-http://localhost:8080}/fhir
      # An ARex manifest points at each image's DocumentReference by its full address on the SENDER's own server, and
      # that resource may not be in the Bundle at all. So references to other servers are accepted and kept as given
      # (the target is not fetched and not checked). Seen on the live server as HAPI-0507 (2026-11-05).
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
    # No published ports: reachable only through Caddy.

  # Java facade: UC07 ODE referral sender and ARex content server. Built from ../facade.
  # Not published: reachable only through Caddy (/ode/* and /arex/*). Caddy does not depend
  # on it, so if it fails the /fhir API keeps working. Build it first on a new rollout
  # (docker compose build facade) so a build failure cannot interrupt the running stack.
  facade:
    build: ../facade
    image: ohia-facade:local
    restart: unless-stopped
    depends_on:
      - hapi
    environment:
      FACADE_HAPI_BASE_URL: http://hapi:8080/fhir
      FACADE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # The same shared token Caddy enforces; the facade checks it again on /ode/**.
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      - facade_data:/data
      # The tester registry lives at facade/config/clients.json (not in git; see
      # facade/config/clients.example.json). Mounted as a folder so a missing file means
      # "nobody registered" rather than Docker creating a directory in its place.
      - ../facade/config:/config:ro

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      - hapi
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Interim shared bearer token enforced in the Caddyfile. Compose refuses to start
      # without it, so the server cannot come up open by accident.
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (openssl rand -hex 32)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  facade_data:
  caddy_data:
  caddy_config:
